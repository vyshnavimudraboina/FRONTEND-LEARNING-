<!DOCTYPE html>
<html>
    <head>
        <title>join us and get started</title>
    </head>
    <body>
        
        <h1>join us and get started</h1>
        <form action="https://www.google.com" method="get">
            <label for="name">full name</label>
            <input type="text" name="name" id="name" placeholder="enter your name" required>
            <br>
            <label for="email">email</label>
            <input type="email" name="email" id="email" placeholder="enter your email" required>
            <br>
            <label for="password">password</label>
            <input type="password" name="password" id="password" placeholder="enter your password" required>
            <br>
            <label for="password">confirm password</label>
            <input type="confirm password" name="confirm password" id="confirm password" placeholder="confirm your password" required>
            <br>
            <label for="gender">gender</label>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">female</label>
            <br>
            date of birth
            <input type="date" name="dob" id="dob">
            <br>
            <label for="country">country</label>
            <select name="country" id="country">
                <option value="">select your country</option>
                <option value="india">india</option>
                <option value="usa">usa</option>
                <option value="uk">uk</option>
                <option value="canada">canada</option>
                </select>

                <br>

                <input type="checkbox" name="" id="">
                <label for="">i agree to the terms and conditions</label>

                <br>

                <button type='submit'>register now</button> <br>
                       already have an account? <a href="login.html">login</a>

        </form>
